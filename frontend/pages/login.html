<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Employee Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../styles/style.css" rel="stylesheet">
</head><body>
<div class="auth-wrap">
  <section class="auth-brand">
    <h1>One place for every employee record.</h1>
    <p>Manage employees, attendance, leave and payroll from a single system. No paperwork, no duplicates.</p>
    <div class="demo">
      <div class="mb-2 fw-semibold">Demo accounts</div>
      <button type="button" class="btn btn-sm btn-outline-light me-1" data-fill="admin@example.com|Admin@123">Fill admin login</button>
      <button type="button" class="btn btn-sm btn-outline-light" data-fill="employee@example.com|Employee@123">Fill employee login</button>
    </div>
  </section>
  <section class="auth-form">
    <form id="loginForm" class="auth-card" novalidate>
      <h3 class="fw-bold mb-1">Sign in</h3>
      <p class="text-muted mb-4">Use your work email and password.</p>
      <div id="msg"></div>
      <div class="mb-3"><label class="form-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" required autocomplete="username">
        <div class="invalid-feedback">Please enter a valid email address.</div></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" required autocomplete="current-password">
        <div class="invalid-feedback">Password is required.</div></div>
      <button class="btn btn-primary w-100" id="btn">Sign in</button>
      <div class="text-center mt-3"><a href="forgot-password.html">Forgot password?</a></div>
    </form>
  </section>
</div>
<script src="../assets/js/api.js"></script>
<script>
if (API.token()) location.href = 'app.html';
document.querySelectorAll('[data-fill]').forEach(b => b.onclick = () => {
  const [e, p] = b.dataset.fill.split('|'); email.value = e; password.value = p;
});
loginForm.onsubmit = async ev => {
  ev.preventDefault();
  loginForm.classList.add('was-validated');
  if (!loginForm.checkValidity()) return;
  btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in...';
  try {
    const r = await API.post('/api/auth/login', { email: email.value, password: password.value });
    localStorage.setItem('ems_token', r.token);
    localStorage.setItem('ems_user', JSON.stringify(r.user));
    location.href = 'app.html'; // dashboard is chosen by role inside app.html
  } catch (e) {
    msg.innerHTML = '<div class="alert alert-danger py-2">' + e.message.replace(/</g, '&lt;') + '</div>';
    btn.disabled = false; btn.textContent = 'Sign in';
  }
};
</script></body></html>
