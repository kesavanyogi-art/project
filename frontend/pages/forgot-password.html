<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password - EMS</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../styles/style.css" rel="stylesheet">
</head><body class="d-flex align-items-center justify-content-center" style="min-height:100vh">
<div class="card-box" style="width:100%;max-width:420px">
  <h4 class="fw-bold">Reset your password</h4>
  <p class="text-muted">Step 1: enter your email to get a reset code. Step 2: enter the code and a new password.</p>
  <div id="msg"></div>
  <form id="f1" novalidate>
    <div class="mb-3"><label class="form-label">Email</label><input type="email" id="email" class="form-control" required></div>
    <button class="btn btn-primary w-100">Get reset code</button>
  </form>
  <form id="f2" class="d-none" novalidate>
    <div class="mb-3"><label class="form-label">Reset code</label><input id="code" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">New password</label><input type="password" id="np" class="form-control" required
      pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$">
      <div class="form-text">Min 8 characters with uppercase, lowercase, number and special character.</div></div>
    <button class="btn btn-primary w-100">Reset password</button>
  </form>
  <div class="text-center mt-3"><a href="login.html">Back to login</a></div>
</div>
<script src="../assets/js/api.js"></script>
<script>
const show = (t, m) => msg.innerHTML = `<div class="alert alert-${t} py-2"></div>`, setMsg = (t, m) => { show(t); msg.firstChild.textContent = m; };
f1.onsubmit = async e => { e.preventDefault();
  if (!email.value) return setMsg('danger', 'Please enter your email.');
  try { const r = await API.post('/api/auth/forgot-password', { email: email.value });
    setMsg('info', r.message + (r.resetCode ? ' (Demo mode - your code is: ' + r.resetCode + ')' : ''));
    if (r.resetCode) { code.value = r.resetCode; f2.classList.remove('d-none'); f1.classList.add('d-none'); }
  } catch (x) { setMsg('danger', x.message); } };
f2.onsubmit = async e => { e.preventDefault();
  if (!f2.checkValidity()) return setMsg('danger', 'Enter the code and a strong password (8+ chars, upper, lower, number, special).');
  try { const r = await API.post('/api/auth/reset-password', { resetCode: code.value, newPassword: np.value });
    setMsg('success', r.message); setTimeout(() => location.href = 'login.html', 1500);
  } catch (x) { setMsg('danger', x.message); } };
</script></body></html>
