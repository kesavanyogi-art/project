<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../styles/style.css" rel="stylesheet">
</head><body>
<nav id="sidebar"></nav>
<div id="main">
  <header class="topbar">
    <button class="btn btn-light d-lg-none" id="menuBtn" aria-label="Menu"><i class="bi bi-list"></i></button>
    <form class="search" id="globalSearch"><div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
      <input class="form-control" id="globalQ" placeholder="Search employees..."></div></form>
    <div class="ms-auto d-flex align-items-center gap-2">
      <div class="dropdown">
        <button class="btn btn-light position-relative" data-bs-toggle="dropdown" data-bs-auto-close="outside" id="bellBtn" aria-label="Notifications">
          <i class="bi bi-bell"></i><span id="bellCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span></button>
        <div class="dropdown-menu dropdown-menu-end p-0" style="width:320px;max-height:380px;overflow:auto">
          <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom"><strong>Notifications</strong>
            <a href="#" id="markRead" class="small">Mark all read</a></div>
          <div id="notifList"></div></div>
      </div>
      <div class="dropdown">
        <button class="btn btn-light d-flex align-items-center gap-2" data-bs-toggle="dropdown"><span class="avatar" id="meAvatar"></span><span id="meName" class="d-none d-md-inline"></span></button>
        <ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item" href="#profile">My profile</a></li>
          <li><a class="dropdown-item" href="#settings">Change password</a></li><li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="#" id="logoutTop">Logout</a></li></ul>
      </div>
    </div>
  </header>
  <main class="content" id="view"></main>
</div>

<!-- Reusable form modal -->
<div class="modal fade" id="appModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable" id="appModalDialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="appModalTitle"></h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body"><div id="appModalError"></div><div id="appModalBody"></div></div>
  <div class="modal-footer" id="appModalFooter"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="appModalSave">Save</button></div>
</div></div></div>
<!-- Confirmation dialog -->
<div class="modal fade" id="confirmModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
  <div class="modal-body pt-4"><p id="confirmText" class="mb-0 fs-6"></p></div>
  <div class="modal-footer border-0"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-danger" id="confirmOk">Confirm</button></div>
</div></div></div>
<!-- Toasts -->
<div class="toast-container position-fixed top-0 end-0 p-3" id="toasts" style="z-index:2000"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../components/ui.js"></script>
<script src="../assets/js/dashboard.js"></script>
<script src="../assets/js/employees.js"></script>
<script src="../assets/js/departments.js"></script>
<script src="../assets/js/attendance.js"></script>
<script src="../assets/js/leaves.js"></script>
<script src="../assets/js/payroll.js"></script>
<script src="../assets/js/reports.js"></script>
<script src="../assets/js/profile.js"></script>
<script src="../assets/js/main.js"></script>
</body></html>
