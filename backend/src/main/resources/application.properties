server.port=8080
spring.application.name=employee-management-system

# ---- MySQL connection (change user/password to match your MySQL) ----
spring.datasource.url=jdbc:mysql://localhost:3306/ems_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root

# Allow profile photos (base64) in JSON requests
server.tomcat.max-http-form-post-size=5MB
spring.mvc.throw-exception-if-no-handler-found=false
